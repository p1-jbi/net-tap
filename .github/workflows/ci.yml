name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test Suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck \
            tcpdump \
            iproute2 \
            ethtool \
            jq \
            tshark \
            iptables \
            procps \
            python3-scapy \
            python3-jsonschema

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install bash shellcheck jq
          python3 -m pip install --user --break-system-packages scapy cryptography jsonschema
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Run ShellCheck & Unprivileged Tests
        run: |
          make test

      - name: Run Privileged Namespace Integration Tests
        if: runner.os == 'Linux'
        run: |
          sudo PYTHONDONTWRITEBYTECODE=1 tests/run_tests.sh

      - name: Run Privileged macOS Capture Test
        if: runner.os == 'macOS'
        run: |
          sudo env PATH="$PATH" bash tests/run_macos_capture_test.sh

      - name: Normalize Artifact Permissions
        if: failure() && runner.os == 'Linux'
        run: |
          sudo chmod -R a+r /var/run/net-tap/ /tmp/net-tap-* 2>/dev/null || true

      - name: Archive Test Failure Diagnostics
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-diagnostics-${{ matrix.os }}
          path: |
            /var/run/net-tap/
            /tmp/net-tap-*
          if-no-files-found: ignore
